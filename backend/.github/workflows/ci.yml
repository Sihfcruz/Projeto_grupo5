name: CI Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nomade
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos do TypeScript
        run: npx tsc --noEmit

      - name: Criar tabelas no banco de dados
        run: mysql -h 127.0.0.1 -u root -proot < src/config/schema.sql

      - name: Executar testes unitários e de integração
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: nomade
          DB_PORT: 3306
          JWT_SECRET: "chave_secreta_de_teste"
        run: npm run test