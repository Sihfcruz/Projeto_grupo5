<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Nômade: gestão de estoque de calçados." />
    <title>Movimentações · Nômade</title>
    <link rel="icon" href="src/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="src/styles/global.css" />
    <script type="module" src="src/scripts/app.js"></script>
  </head>
  <body data-page="movements">
    <a class="skip-link" href="#content">Pular para o conteúdo</a>
    <div id="shell"></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="detail-dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title">Detalhes</h2>
        <button
          class="icon-button"
          id="close-dialog"
          aria-label="Fechar detalhes"
          type="button"
        >
          ✕
        </button>
      </div>
      <div class="dialog-body" id="dialog-content"></div>
    </dialog>
    <noscript
      ><p class="noscript">
        Ative o JavaScript para carregar os dados e utilizar o Nômade.
      </p></noscript
    >
  </body>
</html>
